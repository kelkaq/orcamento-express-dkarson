name: Testar serviços online DKARSON
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: online-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar e testar verificação Google Play
        run: |
          cd server/play-billing
          npm install --no-audit --no-fund
          node --check server.mjs
          npm test
      - name: Instalar e testar serviço online
        run: |
          cd server/online
          npm install --no-audit --no-fund
          node --check server.mjs
          node --check web/app.js
          npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Testar e conferir sintaxe do backend Supabase Edge
        run: |
          node --test supabase/functions/orcamento-api/*.test.mjs
          deno check supabase/functions/orcamento-api/index.ts

  banco-postgresql:
    name: Validar migração Supabase e isolamento de dados
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: orcamento_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orcamento_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Preparar cliente PostgreSQL
        run: |
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client)
      - name: Validar migração e proteção RLS
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGDATABASE=orcamento_test
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon; END IF;
            IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated; END IF;
            IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role BYPASSRLS; END IF;
          END $$;
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261108210000_orcamento_express.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261108210000_orcamento_express.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261109004500_private_account_crypto.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261109004500_private_account_crypto.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE relname='oe_users' AND relnamespace='public'::regnamespace)
               THEN RAISE EXCEPTION 'RLS não habilitado'; END IF;
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE relname='oe_recovery_keys' AND relnamespace='public'::regnamespace)
               OR NOT (SELECT relrowsecurity FROM pg_class WHERE relname='oe_crypto_keys' AND relnamespace='public'::regnamespace)
               THEN RAISE EXCEPTION 'RLS de chaves não habilitado'; END IF;
            IF has_table_privilege('anon','public.oe_recovery_keys','SELECT')
               OR has_table_privilege('authenticated','public.oe_crypto_keys','SELECT')
               THEN RAISE EXCEPTION 'Acesso indevido às chaves'; END IF;
            IF (SELECT count(*) FROM public.oe_crypto_keys WHERE key_id='primary-v1')<>1
               THEN RAISE EXCEPTION 'Chave primária ausente ou duplicada'; END IF;
            IF has_table_privilege('anon','public.oe_users','SELECT')
               OR has_table_privilege('authenticated','public.oe_backups','SELECT')
               THEN RAISE EXCEPTION 'Dados expostos a clientes'; END IF;
            IF NOT public.oe_check_rate_limit('ci:test',2,60) THEN RAISE EXCEPTION 'Primeira tentativa'; END IF;
            IF NOT public.oe_check_rate_limit('ci:test',2,60) THEN RAISE EXCEPTION 'Segunda tentativa'; END IF;
            IF public.oe_check_rate_limit('ci:test',2,60) THEN RAISE EXCEPTION 'Limite não aplicado'; END IF;
          END $$;
          SQL

  integracao-real:
    name: Verificar conta sem e-mail no Supabase real
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUD_API_URL: https://hajxpqnmeabyvfctlygp.supabase.co/functions/v1/orcamento-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Criar, recuperar, restringir e excluir conta descartável
        run: node scripts/verify-live-cloud.mjs
