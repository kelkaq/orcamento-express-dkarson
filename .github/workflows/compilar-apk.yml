name: Gerar APK de teste — DKARSON

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar e testar Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obter o código-fonte
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar Android SDK Platform 36.1 e Build Tools 36.0.0
        run: sdkmanager --install 'platform-tools' 'platforms;android-36.1' 'build-tools;36.0.0'

      - name: Instalar Gradle 9.3.1 e cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK de teste
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug

      - name: Rodar testes unitários
        run: gradle --no-daemon --max-workers=2 :app:testDebugUnitTest

      - name: Disponibilizar APK para baixar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORCAMENTO_EXPRESS_DKARSON_TESTE_APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RELATORIOS_TESTES_ANDROID
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
