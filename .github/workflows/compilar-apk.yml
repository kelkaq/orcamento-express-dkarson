name: Gerar APK de teste — DKARSON

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

env:
  # URL pública (sem credenciais) do servidor de verificação seguro.
  BILLING_VERIFY_URL: ${{ vars.BILLING_VERIFY_URL }}
  CLOUD_API_URL: ${{ vars.CLOUD_API_URL }}

# Evita compilar commits antigos repetidamente: só a revisão mais recente permanece ativa.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Compilar e testar Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obter o código-fonte
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar Android SDK Platform 36.1 e Build Tools 36.0.0
        run: sdkmanager --install 'platform-tools' 'platforms;android-36.1' 'build-tools;36.0.0'

      - name: Instalar Gradle 9.3.1 e cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK de teste
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug

      - name: Rodar testes unitários
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Executando testes (tentativa ${attempt}/3)..."
            log_file="${RUNNER_TEMP}/gradle-testes-${attempt}.log"
            if gradle --no-daemon --no-configuration-cache --max-workers=2 :app:testDebugUnitTest 2>&1 | tee "${log_file}"; then
              echo "Testes executados com sucesso."
              exit 0
            fi
            if ! grep -Eiq 'status code (429|502|503|504)|Too Many Requests|Connection reset|Read timed out|MavenArtifactFetcher|HttpURLConnection\\.java' "${log_file}"; then
              echo "::error::Falha nos testes ou no código, não relacionada à indisponibilidade temporária do repositório."
              exit 1
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::Dependência externa continuou indisponível após 3 tentativas."
              exit 1
            fi
            echo "::warning::Falha temporária ao baixar dependência; tentando novamente."
            sleep $((attempt * 30))
          done

      - name: Gerar AAB release, apenas na main e com segredos de upload
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_UPLOAD_KEYSTORE_BASE64}" ] || [ -z "${STORE_PASSWORD}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "::notice::AAB ignorado: configure os segredos privados de assinatura de upload."
            exit 0
          fi
          if [[ "${BILLING_VERIFY_URL}" != https://* ]]; then
            echo "::error::BILLING_VERIFY_URL deve ser HTTPS e apontar para o verificador da assinatura."
            exit 1
          fi
          export KEYSTORE_PATH="${RUNNER_TEMP}/dkarson-upload.jks"
          trap 'rm -f "${KEYSTORE_PATH}"' EXIT
          printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          gradle --no-daemon --no-configuration-cache --max-workers=2 :app:bundleRelease

      - name: Disponibilizar AAB pronto para teste interno na Google Play
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ORCAMENTO_EXPRESS_DKARSON_GOOGLE_PLAY_AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 14

      - name: Disponibilizar APK para baixar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ORCAMENTO_EXPRESS_DKARSON_TESTE_APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RELATORIOS_TESTES_ANDROID
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
